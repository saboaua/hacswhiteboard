<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>CollabBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f1115;--surface:#1a1d24;--surface-2:#242830;--border:#2e333d;--text:#e8eaed;--text-muted:#9aa0a6;--accent:#6366f1;--accent-hover:#818cf8;--danger:#ef4444;--success:#22c55e;--radius:10px;--shadow:0 4px 24px rgba(0,0,0,.4);--canvas-bg:#12141a;--mention:#a78bfa}
html.light{--bg:#f4f5f7;--surface:#fff;--surface-2:#eef0f3;--border:#d8dce3;--text:#1a1d24;--text-muted:#6b7280;--accent:#4f46e5;--accent-hover:#6366f1;--shadow:0 4px 24px rgba(0,0,0,.08);--canvas-bg:#fafbfc;--mention:#7c3aed}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;height:100vh;width:100vw}
.sidebar{width:300px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:20;overflow:hidden}
.sidebar-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo{width:28px;height:28px;background:linear-gradient(135deg,#6366f1,#a855f7);border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff}
.sidebar-header h1{font-size:14px;font-weight:600}.sidebar-header span{font-size:10px;color:var(--text-muted);display:block}
.section{padding:10px 12px;border-bottom:1px solid var(--border)}
.section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:6px}
.user-self{display:flex;align-items:center;gap:8px;background:var(--surface-2);padding:6px 8px;border-radius:8px}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:11px;color:#fff;flex-shrink:0}
.user-self input{flex:1;background:transparent;border:none;color:var(--text);font-size:12px;outline:none}
.users-list{display:flex;flex-direction:column;gap:3px;max-height:72px;overflow-y:auto}
.user-item{display:flex;align-items:center;gap:6px;padding:3px 6px;font-size:11px}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
.board-info{font-size:11px;color:var(--text-muted)}code{background:var(--surface-2);padding:1px 4px;border-radius:3px;font-size:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:6px 10px;border-radius:7px;border:none;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-block{width:100%}.btn-sm{padding:4px 8px;font-size:11px}
.share-row{display:flex;gap:5px;margin-top:6px}.share-row input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:5px 7px;color:var(--text);font-size:10px;outline:none}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.toolbar{height:46px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:2px;padding:0 8px}
.tool-group{display:flex;align-items:center;gap:1px;padding:0 4px;border-right:1px solid var(--border)}.tool-group:last-child{border-right:none}
.tool-btn{width:32px;height:32px;border-radius:7px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;display:grid;place-items:center}
.tool-btn:hover{background:var(--surface-2);color:var(--text)}.tool-btn.active{background:rgba(99,102,241,.2);color:var(--accent-hover)}
.tool-btn svg{width:16px;height:16px;display:block;pointer-events:none}
.color-swatch{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer}.color-swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--accent)}
.stroke-control{display:flex;align-items:center;gap:4px;padding:0 5px}.stroke-control input[type=range]{width:54px;accent-color:var(--accent)}
.canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--canvas-bg);cursor:crosshair}#stage-container{width:100%;height:100%}
.zoom-controls{position:absolute;bottom:14px;right:14px;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:2px;box-shadow:var(--shadow);z-index:10}
.zoom-controls button{width:28px;height:28px;border:none;background:transparent;color:var(--text);border-radius:5px;cursor:pointer;font-size:14px}
.zoom-label{min-width:44px;text-align:center;font-size:11px;color:var(--text-muted)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(5px)}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;width:400px;max-width:94vw;box-shadow:var(--shadow)}
.modal h2{font-size:17px;margin-bottom:4px}.modal p{color:var(--text-muted);font-size:12px;margin-bottom:14px}
.modal label{display:block;font-size:11px;font-weight:500;margin-bottom:4px}
.modal input{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13px;margin-bottom:10px;outline:none}
.modal-actions{display:flex;gap:8px;margin-top:6px}.modal-actions .btn{flex:1}
.toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);padding:8px 14px;border-radius:8px;font-size:12px;box-shadow:var(--shadow);z-index:30;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}
.save-indicator{font-size:10px;color:var(--text-muted);margin-top:4px}.save-indicator.saved{color:var(--success)}
.comments-section{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.comments-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;max-height:200px}
.comment{background:var(--surface-2);border-radius:7px;padding:7px 9px;font-size:11px}
.comment-header{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.comment-avatar{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:600;color:#fff}
.comment-author{font-weight:600;font-size:11px}.comment-time{font-size:9px;color:var(--text-muted);margin-left:auto}
.comment-body{line-height:1.35;word-break:break-word}.comment-body .mention{color:var(--mention);font-weight:600}
.comment-compose{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.comment-compose textarea{width:100%;min-height:48px;max-height:80px;resize:vertical;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px;color:var(--text);font-size:11px;font-family:inherit;outline:none}
.comment-actions{display:flex;align-items:center;gap:5px}.mention-hint{font-size:9px;color:var(--text-muted);flex:1}
.empty-comments{font-size:11px;color:var(--text-muted);text-align:center;padding:12px 6px}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:340px;overflow-y:auto}
.tpl-card{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:12px;cursor:pointer;text-align:left;transition:all .12s}
.tpl-card:hover{border-color:var(--accent);background:rgba(99,102,241,.12)}
.tpl-card h3{font-size:13px;font-weight:600;margin-bottom:3px}.tpl-card p{font-size:11px;color:var(--text-muted);margin:0}
.inline-editor{position:absolute;z-index:50;min-width:120px;min-height:40px;padding:8px 10px;border:2px solid var(--accent);border-radius:6px;background:var(--surface);color:var(--text);font-family:Inter,sans-serif;font-size:16px;outline:none;resize:both;box-shadow:var(--shadow)}
.inline-editor.sticky-edit{font-family:Caveat,cursive;font-size:18px;background:#eab308;color:#1a1d24;border-color:#ca8a04}
</style>
</head>
<body>
<div id="app">
  <div class="overlay" id="join-modal">
    <div class="modal">
      <h2>Join CollabBoard</h2>
      <p>Collaborative whiteboard with templates & comments.</p>
      <label>Your display name</label>
      <input id="name-input" type="text" placeholder="e.g. Alex" maxlength="20" autocomplete="off"/>
      <label>Board ID (optional)</label>
      <input id="board-input" type="text" placeholder="Leave empty for new board" maxlength="40" autocomplete="off"/>
      <div class="modal-actions"><button class="btn btn-primary" id="join-btn">Join Board</button></div>
    </div>
  </div>
  <div class="overlay" id="template-modal" style="display:none">
    <div class="modal" style="width:480px">
      <h2>Choose a template</h2>
      <p>Start from a ready layout, then edit freely.</p>
      <div class="tpl-grid" id="tpl-grid"></div>
      <div class="modal-actions" style="margin-top:14px"><button class="btn btn-ghost" id="tpl-cancel">Cancel</button></div>
    </div>
  </div>
  <aside class="sidebar">
    <div class="sidebar-header"><div class="logo">CB</div><div><h1>CollabBoard</h1><span>Collaborative whiteboard</span></div></div>
    <div class="section"><div class="section-title">You</div><div class="user-self"><div class="avatar" id="self-avatar">A</div><input type="text" id="self-name" placeholder="Your name" maxlength="20"/></div></div>
    <div class="section"><div class="section-title">Collaborators <span id="user-count">(0)</span></div><div class="users-list" id="users-list"></div></div>
    <div class="section">
      <div class="section-title">Board</div>
      <div class="board-info">ID: <code id="board-id-display">—</code></div>
      <div class="share-row"><input type="text" id="share-link" readonly/><button class="btn btn-ghost btn-sm" id="copy-link-btn">Copy</button></div>
      <div class="save-indicator" id="save-indicator">Auto-saved</div>
      <button class="btn btn-ghost btn-block btn-sm" id="new-board-btn" style="margin-top:6px">+ New Board</button>
    </div>
    <div class="section comments-section">
      <div class="section-title">Comments <span id="comment-count">(0)</span></div>
      <div class="comments-list" id="comments-list"><div class="empty-comments">No comments yet.</div></div>
      <div class="comment-compose">
        <textarea id="comment-input" placeholder="Note or question… @Name to mention" maxlength="500"></textarea>
        <div class="comment-actions"><span class="mention-hint">@ to mention</span><button class="btn btn-primary btn-sm" id="comment-send">Post</button></div>
      </div>
    </div>
    <div class="section" style="border-bottom:none">
      <div class="section-title">Actions</div>
      <button class="btn btn-ghost btn-block btn-sm" id="templates-btn">Templates</button>
      <button class="btn btn-ghost btn-block btn-sm" id="theme-btn" style="margin-top:4px">Switch to Light</button>
      <button class="btn btn-ghost btn-block btn-sm" id="export-png-btn" style="margin-top:4px">Export PNG</button>
      <button class="btn btn-ghost btn-block btn-sm" id="clear-btn" style="margin-top:4px;color:var(--danger)">Clear Board</button>
    </div>
  </aside>
  <div class="main">
    <div class="toolbar">
      <div class="tool-group">
        <button class="tool-btn active" data-tool="select" title="Select"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="M13 13l6 6"/></svg></button>
        <button class="tool-btn" data-tool="pan" title="Pan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></button>
      </div>
      <div class="tool-group">
        <button class="tool-btn" data-tool="pen" title="Pen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg></button>
        <button class="tool-btn" data-tool="rect" title="Rectangle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></button>
        <button class="tool-btn" data-tool="ellipse" title="Ellipse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="9" ry="6"/></svg></button>
        <button class="tool-btn" data-tool="line" title="Line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19L19 5"/></svg></button>
        <button class="tool-btn" data-tool="arrow" title="Arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg></button>
        <button class="tool-btn" data-tool="text" title="Text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg></button>
        <button class="tool-btn" data-tool="sticky" title="Sticky"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3z"/><path d="M15 3v6h6"/></svg></button>
        <button class="tool-btn" data-tool="eraser" title="Eraser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16c-1.5-1.5-1.5-3.5 0-5l7-7c1.5-1.5 3.5-1.5 5 0l5 5"/><path d="M6 11l5 5"/></svg></button>
      </div>
      <div class="tool-group">
        <div class="color-swatch active" data-color="#6366f1" style="background:#6366f1"></div>
        <div class="color-swatch" data-color="#ef4444" style="background:#ef4444"></div>
        <div class="color-swatch" data-color="#22c55e" style="background:#22c55e"></div>
        <div class="color-swatch" data-color="#eab308" style="background:#eab308"></div>
        <div class="color-swatch" data-color="#f97316" style="background:#f97316"></div>
        <div class="color-swatch" data-color="#ec4899" style="background:#ec4899"></div>
        <div class="color-swatch" data-color="#ffffff" style="background:#fff;border:1px solid #999"></div>
        <div class="color-swatch" data-color="#1a1d24" style="background:#1a1d24;border:1px solid #555"></div>
      </div>
      <div class="tool-group stroke-control"><span style="font-size:10px;color:var(--text-muted)">Stroke</span><input type="range" id="stroke-width" min="1" max="20" value="3"/></div>
    </div>
    <div class="canvas-wrap" id="canvas-wrap">
      <div id="stage-container"></div>
      <div class="zoom-controls"><button id="zoom-out">−</button><span class="zoom-label" id="zoom-label">100%</span><button id="zoom-in">+</button><button id="zoom-fit">⊡</button></div>
      <textarea id="inline-editor" class="inline-editor" style="display:none"></textarea>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/konva@9/konva.min.js"></script>

function uuid(){if(typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function')return crypto.randomUUID();return'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16);});}
const COLORS=['#6366f1','#ef4444','#22c55e','#eab308','#f97316','#ec4899','#06b6d4','#8b5cf6'];
let userId=localStorage.getItem('cb_uid')||uuid();localStorage.setItem('cb_uid',userId);
let userName=localStorage.getItem('cb_name')||'';
let userColor=localStorage.getItem('cb_color')||COLORS[Math.floor(Math.random()*COLORS.length)];localStorage.setItem('cb_color',userColor);
let boardId=new URLSearchParams(location.search).get('board')||'';
let currentTool='select',currentColor='#6366f1',strokeWidth=3;
let ydoc,yObjects,yComments,provider,awareness,stage,layer,transformer;
let saveTimer=null,isRestoring=false,editingId=null;
let theme=localStorage.getItem('cb_theme')||'dark';
function applyTheme(){document.documentElement.classList.toggle('light',theme==='light');const b=document.getElementById('theme-btn');if(b)b.textContent=theme==='light'?'Switch to Dark':'Switch to Light';const w=document.getElementById('canvas-wrap');if(w)w.style.background=getComputedStyle(document.documentElement).getPropertyValue('--canvas-bg');}
applyTheme();
function showToast(m,ms=2200){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),ms);}
function updateSelfUI(){document.getElementById('self-name').value=userName;const a=document.getElementById('self-avatar');a.textContent=(userName||'A')[0].toUpperCase();a.style.background=userColor;}
function storageKey(){return'cb_board_'+boardId;}function commentsKey(){return'cb_comments_'+boardId;}
function saveBoardLocal(){if(!yObjects||!boardId||isRestoring)return;try{localStorage.setItem(storageKey(),JSON.stringify(Array.from(yObjects.entries())));if(yComments)localStorage.setItem(commentsKey(),JSON.stringify(yComments.toArray()));const el=document.getElementById('save-indicator');if(el){el.textContent='Saved · '+new Date().toLocaleTimeString();el.classList.add('saved');}}catch(e){}}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveBoardLocal,400);}
function loadBoardLocal(){if(!boardId)return;try{const raw=localStorage.getItem(storageKey());if(raw){const data=JSON.parse(raw);if(Array.isArray(data)&&data.length){isRestoring=true;ydoc.transact(()=>data.forEach(([id,obj])=>{if(id&&obj)yObjects.set(id,obj);}));isRestoring=false;showToast('Restored board');}}const craw=localStorage.getItem(commentsKey());if(craw&&yComments){const cs=JSON.parse(craw);if(Array.isArray(cs)&&cs.length&&yComments.length===0){isRestoring=true;ydoc.transact(()=>cs.forEach(c=>yComments.push([c])));isRestoring=false;}}}catch(e){isRestoring=false;}}
function escapeHtml(s){return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');}
function formatCommentBody(t){return escapeHtml(t).replace(/@([A-Za-z0-9_\- ]{1,30})/g,'<span class="mention">@$1</span>');}
function timeAgo(ts){const s=Math.floor((Date.now()-ts)/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';}
function renderComments(){const list=document.getElementById('comments-list'),count=document.getElementById('comment-count');if(!yComments)return;const cs=yComments.toArray();count.textContent='('+cs.length+')';if(!cs.length){list.innerHTML='<div class="empty-comments">No comments yet.</div>';return;}list.innerHTML=cs.map(c=>`<div class="comment"><div class="comment-header"><div class="comment-avatar" style="background:${c.color||'#6366f1'}">${(c.name||'?')[0].toUpperCase()}</div><span class="comment-author">${escapeHtml(c.name||'Anon')}</span><span class="comment-time">${timeAgo(c.ts||0)}</span></div><div class="comment-body">${formatCommentBody(c.text||'')}</div></div>`).join('');list.scrollTop=list.scrollHeight;}
function postComment(){const input=document.getElementById('comment-input');const text=(input.value||'').trim();if(!text||!yComments)return;yComments.push([{id:uuid().slice(0,8),userId,name:userName||'Anonymous',color:userColor,text,ts:Date.now()}]);input.value='';scheduleSave();showToast('Comment posted');}
function updateUsersList(){if(!awareness)return;const states=Array.from(awareness.getStates().values());const others=states.filter(s=>s.user&&s.user.id!==userId);document.getElementById('user-count').textContent='('+(others.length+1)+')';document.getElementById('users-list').innerHTML=others.map(s=>{const u=s.user;return`<div class="user-item"><div class="status-dot"></div><div class="avatar" style="width:20px;height:20px;font-size:9px;background:${u.color}">${(u.name||'?')[0].toUpperCase()}</div><span>${escapeHtml(u.name||'User')}</span></div>`;}).join('')||'<div style="font-size:11px;color:var(--text-muted)">Only you</div>';}
function applyTemplate(key){const tpl=TEMPLATES[key];if(!tpl||!yObjects)return;if(yObjects.size>0&&!confirm('Replace board with "'+tpl.name+'" template?'))return;ydoc.transact(()=>{Array.from(yObjects.keys()).forEach(k=>yObjects.delete(k));(tpl.objects||[]).forEach(obj=>{const o=Object.assign({},obj);o.createdBy=userId;o.createdAt=Date.now();yObjects.set(o.id,o);});});document.getElementById('template-modal').style.display='none';scheduleSave();showToast('Template: '+tpl.name);setTimeout(renderAllObjects,50);}
function openTemplates(){const grid=document.getElementById('tpl-grid');grid.innerHTML=Object.keys(TEMPLATES).map(k=>{const t=TEMPLATES[k];return`<div class="tpl-card" data-tpl="${k}"><h3>${t.name}</h3><p>${t.desc}</p></div>`;}).join('');grid.querySelectorAll('.tpl-card').forEach(c=>c.addEventListener('click',()=>applyTemplate(c.dataset.tpl)));document.getElementById('template-modal').style.display='flex';}
function closeEditor(save){const ed=document.getElementById('inline-editor');if(ed.style.display==='none')return;if(save&&editingId&&yObjects){const obj=yObjects.get(editingId);if(obj)updateObject(editingId,{text:ed.value});}ed.style.display='none';editingId=null;}
function openEditor(id){const obj=yObjects.get(id);if(!obj||(obj.type!=='text'&&obj.type!=='sticky'))return;closeEditor(false);editingId=id;const ed=document.getElementById('inline-editor');const scale=stage.scaleX();let wx,wy,ww,wh;if(obj.type==='sticky'){wx=(obj.x*scale)+stage.x();wy=(obj.y*scale)+stage.y();ww=(obj.width||160)*scale;wh=(obj.height||140)*scale;ed.className='inline-editor sticky-edit';ed.style.background=obj.fill||'#eab308';}else{wx=(obj.x*scale)+stage.x();wy=(obj.y*scale)+stage.y();ww=(obj.width||200)*scale;wh=Math.max(40,36*scale);ed.className='inline-editor';ed.style.background='';}ed.value=obj.text||'';ed.style.display='block';ed.style.left=Math.max(0,wx)+'px';ed.style.top=Math.max(0,wy)+'px';ed.style.width=Math.max(120,ww)+'px';ed.style.height=Math.max(40,wh)+'px';ed.focus();ed.select();}
function initBoard(id){boardId=id||uuid().slice(0,8);const url=new URL(location.href);url.searchParams.set('board',boardId);history.replaceState({},'',url);document.getElementById('board-id-display').textContent=boardId;document.getElementById('share-link').value=location.href;ydoc=new Y.Doc();yObjects=ydoc.getMap('objects');yComments=ydoc.getArray('comments');provider=new WebrtcProvider('collabboard-'+boardId,ydoc,{signaling:['wss://signaling.yjs.dev']});awareness=provider.awareness;awareness.setLocalStateField('user',{id:userId,name:userName,color:userColor});awareness.on('change',updateUsersList);updateUsersList();yObjects.observe(()=>{renderAllObjects();scheduleSave();});yComments.observe(()=>{renderComments();scheduleSave();});loadBoardLocal();setTimeout(()=>{renderAllObjects();renderComments();},300);}
function initStage(){const wrap=document.getElementById('canvas-wrap');stage=new Konva.Stage({container:'stage-container',width:wrap.clientWidth,height:wrap.clientHeight});layer=new Konva.Layer();stage.add(layer);transformer=new Konva.Transformer({borderStroke:'#6366f1',anchorStroke:'#6366f1',anchorFill:'#fff',anchorSize:8});layer.add(transformer);stage.on('mousedown touchstart',onPointerDown);stage.on('mousemove touchmove',onPointerMove);stage.on('mouseup touchend',onPointerUp);stage.on('wheel',e=>{e.evt.preventDefault();const scaleBy=1.08,oldScale=stage.scaleX(),pointer=stage.getPointerPosition();const mp={x:(pointer.x-stage.x())/oldScale,y:(pointer.y-stage.y())/oldScale};const ns=e.evt.deltaY>0?oldScale/scaleBy:oldScale*scaleBy;const c=Math.max(.1,Math.min(5,ns));stage.scale({x:c,y:c});stage.position({x:pointer.x-mp.x*c,y:pointer.y-mp.y*c});stage.batchDraw();document.getElementById('zoom-label').textContent=Math.round(c*100)+'%';});window.addEventListener('resize',()=>{stage.width(wrap.clientWidth);stage.height(wrap.clientHeight);});}
let isDrawing=false,drawingId=null,startPos=null;
function getPointerPos(){const p=stage.getPointerPosition();if(!p)return null;return stage.getAbsoluteTransform().copy().invert().point(p);}
function createObject(type,attrs){const id=uuid().slice(0,10);yObjects.set(id,{id,type,...attrs,createdBy:userId,createdAt:Date.now()});return id;}
function updateObject(id,ch){const o=yObjects.get(id);if(o)yObjects.set(id,{...o,...ch});}
function renderAllObjects(){if(!layer)return;layer.find('Line, Rect, Ellipse, Arrow, Text, Group').forEach(n=>{if(n!==transformer)n.destroy();});Array.from(yObjects.entries()).forEach(([id,obj])=>{let node;if(obj.type==='pen'&&obj.points)node=new Konva.Line({id,points:obj.points,stroke:obj.stroke,strokeWidth:obj.strokeWidth||3,lineCap:'round',lineJoin:'round',tension:.4,draggable:currentTool==='select'});else if(obj.type==='rect')node=new Konva.Rect({id,x:obj.x,y:obj.y,width:obj.width,height:obj.height,fill:(obj.fill||'#6366f1')+'33',stroke:obj.stroke||obj.fill,strokeWidth:obj.strokeWidth||2,cornerRadius:4,draggable:currentTool==='select'});else if(obj.type==='ellipse')node=new Konva.Ellipse({id,x:obj.x+(obj.width||0)/2,y:obj.y+(obj.height||0)/2,radiusX:Math.abs((obj.width||0)/2),radiusY:Math.abs((obj.height||0)/2),fill:(obj.fill||'#6366f1')+'33',stroke:obj.stroke||obj.fill,strokeWidth:obj.strokeWidth||2,draggable:currentTool==='select'});else if(obj.type==='line'||obj.type==='arrow')node=new Konva.Arrow({id,points:obj.points||[obj.x,obj.y,obj.x+(obj.width||0),obj.y+(obj.height||0)],stroke:obj.stroke||'#6366f1',strokeWidth:obj.strokeWidth||3,fill:obj.stroke||'#6366f1',pointerLength:obj.type==='arrow'?12:0,pointerWidth:obj.type==='arrow'?10:0,draggable:currentTool==='select'});else if(obj.type==='text')node=new Konva.Text({id,x:obj.x,y:obj.y,text:obj.text||'Text',fontSize:obj.fontSize||18,fontFamily:'Inter',fill:obj.fill||(theme==='light'?'#1a1d24':'#e8eaed'),draggable:currentTool==='select',width:obj.width||200});else if(obj.type==='sticky'){const g=new Konva.Group({id,x:obj.x,y:obj.y,draggable:currentTool==='select'});g.add(new Konva.Rect({width:obj.width||160,height:obj.height||140,fill:obj.fill||'#eab308',shadowColor:'black',shadowBlur:6,shadowOpacity:.2,cornerRadius:2}));g.add(new Konva.Text({text:obj.text||'Sticky',fontSize:15,fontFamily:'Caveat',fill:'#1a1d24',width:(obj.width||160)-14,padding:8}));node=g;}if(node){node.on('click tap',()=>{if(currentTool==='eraser')yObjects.delete(id);else if(currentTool==='select'){transformer.nodes([node]);layer.batchDraw();}});if(obj.type==='text'||obj.type==='sticky'){node.on('dblclick dbltap',()=>openEditor(id));}layer.add(node);}});layer.batchDraw();}
function onPointerDown(e){if(currentTool==='pan'||e.evt.button===1)return;const pos=getPointerPos();if(!pos)return;if(currentTool==='select'){if(e.target===stage)transformer.nodes([]);return;}if(currentTool==='eraser')return;isDrawing=true;startPos=pos;if(currentTool==='pen')drawingId=createObject('pen',{points:[pos.x,pos.y],stroke:currentColor,strokeWidth});else if(['rect','ellipse','line','arrow'].includes(currentTool))drawingId=createObject(currentTool,{x:pos.x,y:pos.y,width:0,height:0,points:[pos.x,pos.y,pos.x,pos.y],fill:currentColor,stroke:currentColor,strokeWidth});else if(currentTool==='sticky'){const sid=createObject('sticky',{x:pos.x,y:pos.y,width:160,height:140,fill:currentColor==='#ffffff'?'#eab308':currentColor,text:''});isDrawing=false;setTimeout(()=>openEditor(sid),50);}else if(currentTool==='text'){const tid=createObject('text',{x:pos.x,y:pos.y,width:200,text:'',fill:currentColor});isDrawing=false;setTimeout(()=>openEditor(tid),50);}}
function onPointerMove(){if(!isDrawing||!drawingId)return;const pos=getPointerPos();if(!pos||!startPos)return;const obj=yObjects.get(drawingId);if(!obj)return;if(currentTool==='pen')updateObject(drawingId,{points:obj.points.concat([pos.x,pos.y])});else if(['rect','ellipse'].includes(currentTool))updateObject(drawingId,{width:pos.x-startPos.x,height:pos.y-startPos.y});else if(['line','arrow'].includes(currentTool))updateObject(drawingId,{points:[startPos.x,startPos.y,pos.x,pos.y]});}
function onPointerUp(){isDrawing=false;drawingId=null;startPos=null;}
document.querySelectorAll('.tool-btn[data-tool]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tool-btn[data-tool]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentTool=btn.dataset.tool;if(currentTool!=='select'&&transformer)transformer.nodes([]);renderAllObjects();}));
document.querySelectorAll('.color-swatch').forEach(sw=>sw.addEventListener('click',()=>{document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));sw.classList.add('active');currentColor=sw.dataset.color;}));

document.getElementById('clear-btn').addEventListener('click',()=>{if(confirm('Clear board for everyone?')){ydoc.transact(()=>yObjects.clear());localStorage.removeItem(storageKey());showToast('Cleared');}});

document.getElementById('comment-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();postComment();}});
document.getElementById('self-name').addEventListener('change',e=>{userName=e.target.value.trim()||'Anonymous';localStorage.setItem('cb_name',userName);updateSelfUI();if(awareness)awareness.setLocalStateField('user',{id:userId,name:userName,color:userColor});});
document.getElementById('join-btn').addEventListener('click',()=>{userName=document.getElementById('name-input').value.trim()||'Anonymous';localStorage.setItem('cb_name',userName);updateSelfUI();document.getElementById('join-modal').style.display='none';initStage();initBoard(document.getElementById('board-input').value.trim()||undefined);showToast('Joined');});
document.getElementById('inline-editor').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeEditor(false);}if(e.key==='Enter'&&!e.shiftKey&&editingId){const obj=yObjects&&yObjects.get(editingId);if(obj&&obj.type==='text'){e.preventDefault();closeEditor(true);}}});
