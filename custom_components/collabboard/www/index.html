<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>CollabBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f1115;--surface:#1a1d24;--surface-2:#242830;--border:#2e333d;--text:#e8eaed;--text-muted:#9aa0a6;--accent:#6366f1;--accent-hover:#818cf8;--danger:#ef4444;--success:#22c55e;--shadow:0 4px 24px rgba(0,0,0,.4);--canvas-bg:#12141a;--mention:#a78bfa}
html.light{--bg:#f4f5f7;--surface:#fff;--surface-2:#eef0f3;--border:#d8dce3;--text:#1a1d24;--text-muted:#6b7280;--accent:#4f46e5;--canvas-bg:#fafbfc;--mention:#7c3aed}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;height:100vh;width:100vw}
.sidebar{width:280px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:20;overflow:hidden}
.sidebar-header{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.logo{width:26px;height:26px;background:linear-gradient(135deg,#6366f1,#a855f7);border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff}
.sidebar-header h1{font-size:14px;font-weight:600}.sidebar-header span{font-size:10px;color:var(--text-muted);display:block}
.section{padding:8px 10px;border-bottom:1px solid var(--border)}
.section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:5px}
.user-self{display:flex;align-items:center;gap:6px;background:var(--surface-2);padding:5px 7px;border-radius:7px}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:11px;color:#fff}
.user-self input{flex:1;background:transparent;border:none;color:var(--text);font-size:12px;outline:none}
.users-list{max-height:64px;overflow-y:auto}.user-item{display:flex;align-items:center;gap:5px;padding:2px 5px;font-size:11px}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:5px 9px;border-radius:6px;border:none;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}.btn-block{width:100%}.btn-sm{padding:3px 7px;font-size:11px}
.share-row{display:flex;gap:4px;margin-top:5px}.share-row input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:4px 6px;color:var(--text);font-size:10px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.toolbar{height:42px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:2px;padding:0 6px}
.tool-group{display:flex;align-items:center;gap:1px;padding:0 3px;border-right:1px solid var(--border)}
.tool-btn{width:30px;height:30px;border-radius:6px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;font-size:14px}
.tool-btn:hover{background:var(--surface-2);color:var(--text)}.tool-btn.active{background:rgba(99,102,241,.2);color:var(--accent-hover)}
.tool-btn:disabled{opacity:.35;cursor:default}
.color-swatch{width:16px;height:16px;border-radius:50%;border:2px solid transparent;cursor:pointer}.color-swatch.active{border-color:var(--text)}
.canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--canvas-bg);cursor:crosshair}#stage-container{width:100%;height:100%}
.zoom-controls{position:absolute;bottom:12px;right:12px;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:2px;z-index:10}
.zoom-controls button{width:26px;height:26px;border:none;background:transparent;color:var(--text);border-radius:4px;cursor:pointer}
.zoom-label{min-width:40px;text-align:center;font-size:11px;color:var(--text-muted)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;width:380px;max-width:94vw}
.modal h2{font-size:16px;margin-bottom:4px}.modal p{color:var(--text-muted);font-size:12px;margin-bottom:12px}
.modal input{width:100%;padding:7px 9px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13px;margin-bottom:8px}
.modal-actions{display:flex;gap:6px}.modal-actions .btn{flex:1}
.toast{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);padding:7px 12px;border-radius:7px;font-size:12px;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}
.save-indicator{font-size:10px;color:var(--text-muted);margin-top:3px}
.comments-list{max-height:160px;overflow-y:auto}.comment{background:var(--surface-2);border-radius:6px;padding:6px 8px;font-size:11px;margin-bottom:4px}
.comment-header{display:flex;align-items:center;gap:5px;margin-bottom:2px}.comment-avatar{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:9px;color:#fff}
.comment-author{font-weight:600;font-size:11px}.comment-time{font-size:9px;color:var(--text-muted);margin-left:auto}
.comment-body{line-height:1.35}.comment-body .mention{color:var(--mention);font-weight:600}
.comment-compose{display:flex;flex-direction:column;gap:4px;margin-top:5px}
.comment-compose textarea{width:100%;min-height:44px;resize:vertical;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:5px;color:var(--text);font-size:11px;font-family:inherit;outline:none}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:280px;overflow-y:auto}
.tpl-card{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;text-align:left}.tpl-card:hover{border-color:var(--accent)}
.tpl-card h3{font-size:13px;margin-bottom:2px}.tpl-card p{font-size:11px;color:var(--text-muted);margin:0}
.inline-editor{position:absolute;z-index:50;min-width:120px;min-height:36px;padding:6px 8px;border:2px solid var(--accent);border-radius:5px;background:var(--surface);color:var(--text);font-size:15px;outline:none;resize:both;box-shadow:var(--shadow)}
.inline-editor.sticky-edit{font-family:Caveat,cursive;font-size:17px;background:#eab308;color:#1a1d24}
.ctx-menu{position:fixed;z-index:80;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:none}
.ctx-menu.show{display:block}
.ctx-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;border-radius:7px;font-size:12px;cursor:pointer;color:var(--text);border:none;background:transparent;width:100%;font-family:inherit;text-align:left}
.ctx-item:hover{background:var(--surface-2)}
.ctx-item.danger{color:var(--danger)}
.ctx-item .kbd{font-size:10px;color:var(--text-muted)}
.ctx-sep{height:1px;background:var(--border);margin:4px 6px}
.board-info{font-size:11px;color:var(--text-muted)}code{background:var(--surface-2);padding:1px 4px;border-radius:3px;font-size:10px}
.empty-comments{font-size:11px;color:var(--text-muted);text-align:center;padding:10px 6px}
.stroke-control{display:flex;align-items:center;gap:4px;padding:0 4px}.stroke-control input[type=range]{width:50px;accent-color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <div class="overlay" id="join-modal">
    <div class="modal">
      <h2>Join CollabBoard</h2>
      <p>Collaborative whiteboard with templates & comments.</p>
      <label style="font-size:11px">Your display name</label>
      <input id="name-input" type="text" placeholder="e.g. Alex" maxlength="20" autocomplete="off"/>
      <label style="font-size:11px">Board ID (optional)</label>
      <input id="board-input" type="text" placeholder="Leave empty for new board" maxlength="40" autocomplete="off"/>
      <div class="modal-actions"><button class="btn btn-primary" id="join-btn">Join Board</button></div>
    </div>
  </div>
  <div class="overlay" id="template-modal" style="display:none">
    <div class="modal" style="width:460px">
      <h2>Choose a template</h2>
      <p>Start from a ready layout, then edit freely.</p>
      <div class="tpl-grid" id="tpl-grid"></div>
      <div class="modal-actions" style="margin-top:12px"><button class="btn btn-ghost" id="tpl-cancel">Cancel</button></div>
    </div>
  </div>
  <aside class="sidebar">
    <div class="sidebar-header"><div class="logo">CB</div><div><h1>CollabBoard</h1><span>Collaborative whiteboard</span></div></div>
    <div class="section"><div class="section-title">You</div><div class="user-self"><div class="avatar" id="self-avatar">A</div><input type="text" id="self-name" placeholder="Your name" maxlength="20"/></div></div>
    <div class="section"><div class="section-title">Collaborators <span id="user-count">(0)</span></div><div class="users-list" id="users-list"></div></div>
    <div class="section">
      <div class="section-title">Board</div>
      <div class="board-info">ID: <code id="board-id-display">—</code></div>
      <div class="share-row"><input type="text" id="share-link" readonly/><button class="btn btn-ghost btn-sm" id="copy-link-btn">Copy</button></div>
      <div class="save-indicator" id="save-indicator">Auto-saved</div>
      <button class="btn btn-ghost btn-block btn-sm" id="new-board-btn" style="margin-top:6px">+ New Board</button>
    </div>
    <div class="section" style="flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden">
      <div class="section-title">Comments <span id="comment-count">(0)</span></div>
      <div class="comments-list" id="comments-list"><div class="empty-comments">No comments yet.</div></div>
      <div class="comment-compose">
        <textarea id="comment-input" placeholder="Note… @Name to mention" maxlength="500"></textarea>
        <div style="display:flex;justify-content:flex-end"><button class="btn btn-primary btn-sm" id="comment-send">Post</button></div>
      </div>
    </div>
    <div class="section" style="border-bottom:none">
      <button class="btn btn-ghost btn-block btn-sm" id="templates-btn">Templates</button>
      <button class="btn btn-ghost btn-block btn-sm" id="theme-btn" style="margin-top:4px">Switch to Light</button>
      <button class="btn btn-ghost btn-block btn-sm" id="export-png-btn" style="margin-top:4px">Export PNG</button>
      <button class="btn btn-ghost btn-block btn-sm" id="clear-btn" style="margin-top:4px;color:var(--danger)">Clear Board</button>
    </div>
  </aside>
  <div class="main">
    <div class="toolbar">
      <div class="tool-group">
        <button class="tool-btn active" data-tool="select" title="Select">↖</button>
        <button class="tool-btn" data-tool="pan" title="Pan">✋</button>
      </div>
      <div class="tool-group">
        <button class="tool-btn" data-tool="pen" title="Pen">✎</button>
        <button class="tool-btn" data-tool="rect" title="Rectangle">▢</button>
        <button class="tool-btn" data-tool="ellipse" title="Ellipse">◯</button>
        <button class="tool-btn" data-tool="line" title="Line">／</button>
        <button class="tool-btn" data-tool="arrow" title="Arrow">→</button>
        <button class="tool-btn" data-tool="text" title="Text">T</button>
        <button class="tool-btn" data-tool="sticky" title="Sticky">🗒</button>
        <button class="tool-btn" data-tool="eraser" title="Eraser">⌫</button>
      </div>
      <div class="tool-group">
        <button class="tool-btn" id="undo-btn" title="Undo (Ctrl+Z)">↶</button>
        <button class="tool-btn" id="redo-btn" title="Redo (Ctrl+Y)">↷</button>
      </div>
      <div class="tool-group">
        <div class="color-swatch active" data-color="#6366f1" style="background:#6366f1"></div>
        <div class="color-swatch" data-color="#ef4444" style="background:#ef4444"></div>
        <div class="color-swatch" data-color="#22c55e" style="background:#22c55e"></div>
        <div class="color-swatch" data-color="#eab308" style="background:#eab308"></div>
        <div class="color-swatch" data-color="#f97316" style="background:#f97316"></div>
        <div class="color-swatch" data-color="#ec4899" style="background:#ec4899"></div>
        <div class="color-swatch" data-color="#ffffff" style="background:#fff;border:1px solid #999"></div>
        <div class="color-swatch" data-color="#1a1d24" style="background:#1a1d24;border:1px solid #555"></div>
      </div>
      <div class="tool-group stroke-control"><span style="font-size:10px;color:var(--text-muted)">Stroke</span><input type="range" id="stroke-width" min="1" max="20" value="3"/></div>
    </div>
    <div class="canvas-wrap" id="canvas-wrap">
      <div id="stage-container"></div>
      <div class="zoom-controls"><button id="zoom-out">−</button><span class="zoom-label" id="zoom-label">100%</span><button id="zoom-in">+</button><button id="zoom-fit">⊡</button></div>
      <textarea id="inline-editor" class="inline-editor" style="display:none"></textarea>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>
<div class="ctx-menu" id="ctx-menu">
  <button class="ctx-item" data-act="edit"><span>Edit text</span><span class="kbd">Dbl-click</span></button>
  <button class="ctx-item" data-act="copy"><span>Copy</span><span class="kbd">Ctrl+C</span></button>
  <button class="ctx-item" data-act="duplicate"><span>Duplicate</span><span class="kbd">Ctrl+D</span></button>
  <button class="ctx-item" data-act="paste"><span>Paste</span><span class="kbd">Ctrl+V</span></button>
  <div class="ctx-sep"></div>
  <button class="ctx-item" data-act="bring-front"><span>Bring to front</span></button>
  <button class="ctx-item" data-act="send-back"><span>Send to back</span></button>
  <div class="ctx-sep"></div>
  <button class="ctx-item danger" data-act="delete"><span>Delete</span><span class="kbd">Del</span></button>
</div>
<script src="https://unpkg.com/konva@9/konva.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
